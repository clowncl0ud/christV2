<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GhostLink Games</title>
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/virtuan4-max/ghostlinkhub@main/assets/favicon.png">
    <style>
        :root {
            --bg: #000000;
            --accent: #6ecbff;
            --accent-glow: rgba(110, 203, 255, 0.3);
            --text-dim: #94a3b8;
            --border: rgba(110, 203, 255, 0.08);
            --card-bg: rgba(255, 255, 255, 0.03);
            --input-bg: rgba(255, 255, 255, 0.05);
            --font: 'Courier New', monospace;
            --transition-fast: 0.2s ease;
            --transition-slow: 0.4s ease-in;
            --fav-color: #ff4b2b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: white;
            padding: 20px;
            overflow-x: hidden;
            animation: fadeIn var(--transition-slow);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Search */
        .search-container {
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .search-input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            color: var(--accent);
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            background: var(--input-bg);
            border: 2px solid var(--border);
            padding: 14px 20px 14px 45px;
            color: white;
            border-radius: 12px;
            font-family: var(--font);
            outline: none;
            font-size: 1rem;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        #searchInput:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            background: rgba(255, 255, 255, 0.05);
        }

        #sortSelect {
            width: auto;
            flex-shrink: 0;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 14px 12px;
            border-radius: 12px;
            font-family: var(--font);
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            color-scheme: dark;
        }

        .fav-filter-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
            transition: all var(--transition-fast);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .fav-filter-btn.active {
            border-color: var(--fav-color);
            color: var(--fav-color);
            background: rgba(255, 75, 43, 0.05);
        }

        /* Featured Carousel */
        .featured-wrapper {
            width: 100%;
            max-width: 1200px;
            position: relative;
            margin-bottom: 40px;
            padding: 0 60px;
            box-sizing: border-box;
            z-index: 1;
        }
        .featured-header {
            text-align: left;
            margin-bottom: 15px;
            color: var(--accent);
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .carousel-viewport {
            overflow: hidden;
            border-radius: 20px;
            background: rgba(110, 203, 255, 0.02);
            border: 1px solid var(--border);
            padding: 20px 0;
        }
        #featuredContainer {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .featured-item {
            flex: 0 0 calc(20% - 30px);
            margin: 0 15px;
            text-align: center;
            cursor: pointer;
            transition: transform var(--transition-fast);
        }
        .featured-item:hover { transform: scale(1.03); }
        .featured-item img {
            width: 100%;
            aspect-ratio: 2/3;
            border-radius: 15px;
            object-fit: cover;
            border: 2px solid transparent;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .featured-item:hover img {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .nav-btn {
            position: absolute;
            top: 55%;
            transform: translateY(-50%);
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-fast);
        }
        .nav-btn:hover {
            background: var(--input-bg);
            border-color: var(--accent);
        }
        .nav-prev { left: 5px; }
        .nav-next { right: 5px; }

        /* Main Grid */
        #container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            animation: fadeIn var(--transition-slow);
            justify-content: center;
            z-index: 1;
        }
        .zone-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform var(--transition-fast), border var(--transition-fast), box-shadow var(--transition-fast);
        }
        .zone-item:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .zone-item img {
            width: 100%;
            border-radius: 8px;
            aspect-ratio: 1;
            object-fit: cover;
            border: 1px solid var(--border);
        }
        .heart-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1.2rem;
            transition: color var(--transition-fast);
            z-index: 5;
        }
        .heart-btn.active { color: var(--fav-color); }
        .zone-item p {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-dim);
            transition: color var(--transition-fast);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .zone-item:hover p {
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent-glow);
        }

        /* Zone Viewer Overlay */
        #zoneViewer {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: none;
            flex-direction: column;
            z-index: 1000;
            animation: fadeIn var(--transition-slow);
        }
        .zone-header {
            padding: 15px;
            background: var(--bg);
            border-bottom: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #zoneName {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .controls { display: flex; gap: 10px; }
        .control-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-family: var(--font);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .control-btn:hover {
            background: var(--accent);
            color: black;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        #zoneFrame {
            flex-grow: 1;
            border: none;
            width: calc(100% - 24px);
            height: calc(100% - 24px);
            margin: 0 12px 12px 12px;
            background: transparent;
            border-radius: 12px;
            display: block;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--input-bg); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        @media (max-width: 800px) {
            .featured-item { flex: 0 0 calc(50% - 20px); }
            .featured-wrapper { padding: 0 40px; }
            .search-container { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>


    <iframe src="https://www.clowncl0ud.github.io/test9.5"</iframe>







    
</body>
</html>
